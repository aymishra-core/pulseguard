repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^src/pulseguard/
        additional_dependencies:
          - requests==2.34.2
          - beautifulsoup4==4.15.0
          - flask==3.1.3
          - waitress==3.0.2
