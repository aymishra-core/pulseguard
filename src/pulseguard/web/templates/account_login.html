<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to PulseGuard</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon-unknown.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='status.css') }}" />
  </head>
  <body>
    <button type="button" class="icon-btn theme-corner" id="theme-toggle" aria-label="Theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.5 1.5M16.9 16.9l1.5 1.5M18.4 5.6 16.9 7.1M7.1 16.9 5.6 18.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <main class="panel auth">
      <p class="kind">PulseGuard</p>
      <h1>Sign in</h1>
      <p>Is something wrong, what is it, and what do I do next?</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('console_login_submit') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
