<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to PulseGuard</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon-unknown.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='status.css') }}" />
  </head>
  <body>
    <main class="panel auth">
      <p class="kind">PulseGuard</p>
      <h1>Sign in</h1>
      <p>Is something wrong, what is it, and what do I do next?</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('console_login_submit') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
      <button type="button" class="btn-secondary" id="theme-toggle">Theme</button>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
