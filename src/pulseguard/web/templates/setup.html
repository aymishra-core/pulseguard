<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set up PulseGuard</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon-unknown.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='status.css') }}" />
  </head>
  <body>
    <main class="panel auth">
      <p class="kind">PulseGuard</p>
      <h1>Create the admin account</h1>
      <p>This page is shown once. After that, sign in with the same name. The password needs at least 8 characters.</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('setup_submit') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password (at least 8 characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />
        <button type="submit">Create account</button>
      </form>
      <button type="button" class="btn-secondary" id="theme-toggle">Theme</button>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
