<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseGuard login</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon-unknown.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='status.css') }}" />
  </head>
  <body>
    <main class="panel auth">
      <p class="kind">PulseGuard</p>
      <h1>Admin login</h1>
      <p>Is something wrong, what is it, and what do I do next?</p>
      {% if failed %}
      <p>login failed</p>
      {% endif %}
      <form method="post" action="{{ url_for('login_submit') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <p><label>Username <input name="username" autocomplete="username" /></label></p>
        <p><label>Password <input name="password" type="password" autocomplete="current-password" /></label></p>
        <p><button type="submit">Log in</button></p>
      </form>
      <button type="button" class="btn-secondary" id="theme-toggle">Theme</button>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
