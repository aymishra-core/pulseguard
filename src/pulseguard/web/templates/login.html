<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseGuard login</title>
<link rel="icon" href="{{ url_for('static', filename='favicon-unknown.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% include "_sprite.html" %}
<main class="auth">
<button class="icon-btn tr" id="theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme"><svg class="i" aria-hidden="true"><use href="#sun"/></svg></button>
<form class="card auth-card hud" method="post" action="{{ url_for('login_submit') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="brand-row"><span class="brand-mark"><svg class="i i-lg" aria-hidden="true"><use href="#pulse"/></svg></span><div><b>PulseGuard</b><div class="faint">UPTIME CONSOLE</div></div></div>
<div><h1>Admin login</h1><p class="sub">Operator access for the catalog.</p></div>
{% if failed %}<p role="alert">login failed</p>{% endif %}
<div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary" type="submit">Log in</button>
</form>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
